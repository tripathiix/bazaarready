<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{auth/parts :: head('Create your account')}"></head>
<body>
<main class="wrap">
    <a class="brand" href="/">Bazaar<span>Ready</span></a>
    <h1>Create your free account</h1>
    <p class="lead">One account keeps all your websites, orders and messages in one place.</p>
    <div class="card">
    <a class="btn google" th:if="${googleEnabled}" href="/oauth2/authorization/google">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        Continue with Google
    </a>
    <p class="or" th:if="${googleEnabled}"><span>or with email</span></p>
        <form method="post" th:action="@{/signup}">
            <p class="error" th:if="${error}" th:text="${error}" role="alert">Error</p>
            <label>Your name
                <input name="name" autocomplete="name" required maxlength="80" th:value="${name}" autofocus>
            </label>
            <label>Email
                <input type="email" name="email" autocomplete="email" required maxlength="200" th:value="${email}">
            </label>
            <label>Password <span class="hint">At least 8 characters</span>
                <input type="password" name="password" autocomplete="new-password" required minlength="8" maxlength="72">
            </label>
            <label>Password again
                <input type="password" name="confirm" autocomplete="new-password" required minlength="8" maxlength="72">
            </label>
            <button class="btn" type="submit">Create account</button>
        </form>
    </div>
    <p class="switch">Already have an account? <a th:href="@{/login}">Sign in</a></p>
    <p class="safe">🔒 Passwords are stored only in scrambled (hashed) form. We never see them.</p>
</main>
<script th:replace="~{pages/parts :: pagelang}"></script>
</body>
</html>
