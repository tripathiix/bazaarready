<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<!-- Shared pieces for BazaarReady's own pages (Templates, How it works, Features): head, top links and footer. -->
<head th:fragment="head(title, description)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">BazaarReady</title>
    <meta name="description" th:content="${description}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Anek+Latin:wght@400;600&family=Kalam:wght@400&display=swap" rel="stylesheet">
    <style>
        :root { --night: #0f0e22; --night-2: #19173a; --panel: #1a1838; --ivory: #f6efe4; --muted: #b9b2c9; --line: rgba(255,255,255,.12);
            --amber: #f4a83a; --rose: #ec7a8c; --jade: #4fc3a1; --mint: #8fd9c4; color-scheme: dark; }
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { margin: 0; color: var(--ivory); font: 1.05rem/1.65 "Anek Latin", "Segoe UI", system-ui, sans-serif; min-height: 100vh;
            background: radial-gradient(60rem 40rem at 10% -10%, rgba(244,168,58,.14), transparent 60%),
                        radial-gradient(50rem 40rem at 100% 30%, rgba(236,122,140,.1), transparent 60%),
                        linear-gradient(180deg, var(--night), var(--night-2)) fixed; }
        a { color: var(--amber); }
        :focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }
        .wrap { max-width: 1100px; margin: 0 auto; padding-left: clamp(16px, 4vw, 32px); padding-right: clamp(16px, 4vw, 32px); }
        .lights { display: block; width: 100%; height: 2.4rem; }
        .lights circle { fill: #ffd27a; filter: drop-shadow(0 0 4px rgba(255,196,92,.9)); animation: twinkle 3.2s ease-in-out infinite; }
        @keyframes twinkle { 0%,100% { opacity: 1 } 50% { opacity: .45 } }
        .top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .8rem 1.5rem; padding-top: .6rem; }
        .brand { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 1.45rem; letter-spacing: -.02em; color: var(--ivory); text-decoration: none; }
        .brand span { background: linear-gradient(100deg, var(--amber), var(--rose)); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .top nav { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem 1.3rem; font-size: .97rem; }
        .top nav a { color: #d8d1e6; text-decoration: none; padding-bottom: 2px; border-bottom: 2px solid transparent; }
        .top nav a:hover, .top nav a:focus-visible { color: var(--ivory); }
        .top nav a.on { color: var(--ivory); border-bottom-color: var(--amber); }
        .top nav a.cta-small { color: #22140a; font-weight: 600; border: 0; border-radius: 999px; padding: .4rem 1rem;
            background: linear-gradient(100deg, var(--amber), #f7c065 55%, var(--rose)); }
        h1, h2, h3 { font-family: "Bricolage Grotesque", sans-serif; line-height: 1.12; }
        h1 { font-size: clamp(2.3rem, 6vw, 3.6rem); font-weight: 800; letter-spacing: -.02em; margin: 2.6rem 0 .6rem; }
        h1 .accent { color: var(--amber); }
        h1, h2, .lead { overflow-wrap: break-word; }
        .lead { color: #cfc7de; font-size: 1.18rem; max-width: 42rem; margin: 0; }
        .hand { font-family: Kalam, cursive; color: #ffd9a0; font-size: 1.2rem; margin: 0; }
        .card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; }
        .cta { display: inline-block; padding: .85rem 1.5rem; border-radius: 999px; text-decoration: none; font-weight: 700;
            color: #22140a; background: linear-gradient(100deg, var(--amber), #f7c065 50%, var(--rose)); }
        .foot { display: flex; flex-direction: column; align-items: center; gap: .7rem; padding: 3.5rem 1rem 2.5rem; text-align: center;
            font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; letter-spacing: -.02em; color: rgba(246,239,228,.35); }
        .foot-mail { font-family: "Anek Latin", sans-serif; font-weight: 400; letter-spacing: 0; font-size: .92rem; color: var(--muted); }
        .foot-mail:hover { color: var(--ivory); }
        .holo { font-family: "Anek Latin", sans-serif; font-weight: 600; font-size: .82rem; letter-spacing: .04em; padding: .35rem .95rem; border-radius: 999px;
            border: 1px solid rgba(255,255,255,.18); background: linear-gradient(110deg, #8c9cff, #ec7a8c, #f4a83a, #4fc3a1, #8c9cff) text, rgba(255,255,255,.04);
            -webkit-background-clip: text; color: transparent; background-size: 300% 100%;
            box-shadow: 0 0 18px rgba(140,156,255,.18), inset 0 0 10px rgba(236,122,140,.12); animation: holo 6s linear infinite; }
        @keyframes holo { to { background-position: 300% 0; } }
        @media (prefers-reduced-motion: no-preference) {
            .rise { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
            @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
        }
        @media (max-width: 640px) {
            .top { flex-direction: column; align-items: flex-start; gap: .6rem; }
            .top nav { width: 100%; gap: .5rem 1.1rem; }
            .top nav a.cta-small { margin-top: .2rem; }
            h1 { margin-top: 1.8rem; }
        }
        @media (prefers-reduced-motion: reduce) { .lights circle, .holo { animation: none; } }
        .lang-pick { font: inherit; font-size: .9rem; color: var(--ivory); background: rgba(255,255,255,.06); border: 1px solid var(--line);
            border-radius: 999px; padding: .3rem .7rem; }
        .lang-pick option { color: #111; }
        .pagelang-note { position: fixed; top: 1rem; left: 50%; transform: translateX(-50%); z-index: 50; padding: .45rem 1rem; border-radius: 999px;
            background: var(--amber); color: #22140a; font-weight: 700; font-size: .95rem; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
        /* 3D tilt for cards on BazaarReady's own pages (see the script in "pagelang"). */
        .card { position: relative; }
        .card::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity .25s ease;
            background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,.16), transparent 55%); }
        .card.tilting { transform: perspective(1000px) rotateX(var(--rx)) rotateY(var(--ry)) translateY(-6px) !important; transition: transform .08s linear !important;
            box-shadow: 0 30px 50px -18px rgba(0,0,0,.7); }
        .card.tilting::after { opacity: 1; }
        .cta, .cta-small { box-shadow: 0 4px 0 rgba(0,0,0,.35), 0 10px 20px rgba(0,0,0,.25); }
        .cta:active, .cta-small:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.35); }
    </style>
</head>
<body>

<div th:fragment="top(active)">

        <path d="M0 4 Q166 46 333 4 M333 4 Q500 46 666 4 M666 4 Q833 46 1000 4" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="1.2"/>
        <circle cx="27.8" cy="11.7" r="3" style="animation-delay:0.45s"/>
        <circle cx="55.6" cy="17.0" r="3" style="animation-delay:0.90s"/>
        <circle cx="83.3" cy="21.6" r="3" style="animation-delay:1.35s"/>
        <circle cx="111.1" cy="25.1" r="3" style="animation-delay:1.80s"/>
        <circle cx="138.9" cy="27.3" r="3" style="animation-delay:2.25s"/>
        <circle cx="166.7" cy="28.0" r="3" style="animation-delay:2.70s"/>
        <circle cx="194.4" cy="27.3" r="3" style="animation-delay:0.00s"/>
        <circle cx="222.2" cy="25.1" r="3" style="animation-delay:0.45s"/>
        <circle cx="250.0" cy="21.6" r="3" style="animation-delay:0.90s"/>
        <circle cx="277.8" cy="17.0" r="3" style="animation-delay:1.35s"/>
        <circle cx="305.6" cy="11.7" r="3" style="animation-delay:1.80s"/>
        <circle cx="361.1" cy="11.7" r="3" style="animation-delay:2.25s"/>
        <circle cx="388.9" cy="17.0" r="3" style="animation-delay:2.70s"/>
        <circle cx="416.7" cy="21.6" r="3" style="animation-delay:0.00s"/>
        <circle cx="444.4" cy="25.1" r="3" style="animation-delay:0.45s"/>
        <circle cx="472.2" cy="27.3" r="3" style="animation-delay:0.90s"/>
        <circle cx="500.0" cy="28.0" r="3" style="animation-delay:1.35s"/>
        <circle cx="527.8" cy="27.3" r="3" style="animation-delay:1.80s"/>
        <circle cx="555.5" cy="25.1" r="3" style="animation-delay:2.25s"/>
        <circle cx="583.3" cy="21.6" r="3" style="animation-delay:2.70s"/>
        <circle cx="611.1" cy="17.0" r="3" style="animation-delay:0.00s"/>
        <circle cx="638.9" cy="11.7" r="3" style="animation-delay:0.45s"/>
        <circle cx="694.4" cy="11.7" r="3" style="animation-delay:0.90s"/>
        <circle cx="722.2" cy="17.0" r="3" style="animation-delay:1.35s"/>
        <circle cx="750.0" cy="21.6" r="3" style="animation-delay:1.80s"/>
        <circle cx="777.8" cy="25.1" r="3" style="animation-delay:2.25s"/>
        <circle cx="805.5" cy="27.3" r="3" style="animation-delay:2.70s"/>
        <circle cx="833.3" cy="28.0" r="3" style="animation-delay:0.00s"/>
        <circle cx="861.1" cy="27.3" r="3" style="animation-delay:0.45s"/>
        <circle cx="888.9" cy="25.1" r="3" style="animation-delay:0.90s"/>
        <circle cx="916.7" cy="21.6" r="3" style="animation-delay:1.35s"/>

        <circle cx="972.2" cy="11.7" r="3" style="animation-delay:2.25s"/>
    </svg>
    <header class="wrap top">
        <a class="brand" href="/">Bazaar<span>Ready</span></a>
        <nav aria-label="Main">
            <a href="/templates" th:classappend="${active == 'templates'} ? 'on'" th:attr="aria-current=${active == 'templates'} ? 'page'">Templates</a>
            <a href="/guide" th:classappend="${active == 'guide'} ? 'on'" th:attr="aria-current=${active == 'guide'} ? 'page'">How it works</a>
            <a href="/features" th:classappend="${active == 'features'} ? 'on'" th:attr="aria-current=${active == 'features'} ? 'page'">Features</a>
            <a href="/contact" th:classappend="${active == 'contact'} ? 'on'" th:attr="aria-current=${active == 'contact'} ? 'page'">Contact</a>
            <a href="/account">My dashboard</a>
            <a class="cta-small" href="/">Build my website</a>
            <select class="lang-pick" aria-label="Language" data-pagelang-pick translate="no">
                <option value="en">English</option><option value="es">Español</option><option value="fr">Français</option>
                <option value="ar">العربية</option><option value="zh">中文</option><option value="pt">Português</option>
                <option value="hi">हिन्दी</option><option value="id">Bahasa Indonesia</option>
            </select>
        </nav>
    </header>
</div>

<footer th:fragment="foot" class="foot">
    <span>BazaarReady</span>
    <a class="foot-mail" href="/contact">Contact us · support@bazaarready.com</a>
    <a class="foot-mail" href="/usage">How we use AI</a>
    <span class="holo">Crafted with <span aria-label="love">♥</span> by Yashi Tripathi</span>
    <script th:replace="~{pages/parts :: pagelang}"></script>
</footer>

<!--
  BazaarReady's own pages are written in English. The language picked on the home page (saved in this browser)
  is applied here too: the page's words go to /api/ui-strings, are translated once per language and page
  version, and are cached on the server and in this browser. Elements marked translate="no" (live numbers,
  names) stay as they are.
-->
<script th:fragment="pagelang" th:attr="nonce=${cspNonce}">
    // ---- 3D tilt: cards lean toward the mouse with a soft light under the pointer.
        // Mouse devices only, and never when motion is turned off. ----
        (function () {
            if (!window.matchMedia || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            if (!matchMedia('(hover: hover) and (pointer: fine)').matches) return;
            var SEL = '.card';
            var current = null;
            function reset(el) { el.classList.remove('tilting'); el.style.removeProperty('--rx'); el.style.removeProperty('--ry'); }
            document.addEventListener('pointermove', function (e) {
                var el = e.target && e.target.closest ? e.target.closest(SEL) : null;
                if (current && current !== el) reset(current);
                current = el;
                if (!el) return;
                var r = el.getBoundingClientRect();
                var x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
                el.style.setProperty('--ry', ((x - 0.5) * 12).toFixed(2) + 'deg');
                el.style.setProperty('--rx', ((0.5 - y) * 9).toFixed(2) + 'deg');
                el.style.setProperty('--mx', (x * 100).toFixed(1) + '%');
                el.style.setProperty('--my', (y * 100).toFixed(1) + '%');
                el.classList.add('tilting');
            }, { passive: true });
            document.addEventListener('pointerleave', function () { if (current) reset(current); });
        })();
(function () {
    var KEY = "bazaarready.language";
    var RTL = ["ar", "fa", "ur", "he", "ps", "sd", "ug", "yi"];
    function saved() {
        var link = new URLSearchParams(location.search).get("lang");
        if (link && /^[a-z]{2,3}$/.test(link)) { try { localStorage.setItem(KEY, link); } catch (e) {} return link; }
        try { var v = localStorage.getItem(KEY); if (v && /^(hinglish|[a-z]{2,3})$/.test(v)) return v; } catch (e) {}
        return "en";
    }
    function nameOf(c) { try { return new Intl.DisplayNames([c], { type: "language" }).of(c) || c; } catch (e) { return c; } }
    var code = saved();
    var pick = document.querySelector("[data-pagelang-pick]");
    if (pick) {
        if (!pick.querySelector('option[value="' + code + '"]')) {
            var o = document.createElement("option");
            o.value = code; o.textContent = nameOf(code);
            pick.appendChild(o);
        }
        pick.value = code;
        pick.addEventListener("change", function () {
            try { localStorage.setItem(KEY, pick.value); } catch (e) {}
            var url = new URL(location.href); url.searchParams.delete("lang"); location.href = url.toString();
        });
    }
    if (code === "en") return;
    document.documentElement.lang = code;
    if (RTL.indexOf(code) >= 0) document.documentElement.dir = "rtl";

    // Collect the words: text nodes and a few attributes, skipping code, hidden decor and translate="no".
    var nodes = [], attrs = [], texts = [], seen = {};
    function add(t) { if (!Object.prototype.hasOwnProperty.call(seen, t)) { seen[t] = texts.length; texts.push(t); } }
    var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {
        acceptNode: function (n) {
            var el = n.parentElement;
            if (!el || el.closest('script,style,svg,noscript,select,[translate="no"],[aria-hidden="true"],.brand')) return NodeFilter.FILTER_REJECT;
            return /\p{L}/u.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
        }
    });
    while (walker.nextNode()) { nodes.push(walker.currentNode); add(walker.currentNode.nodeValue.trim()); }
    document.querySelectorAll("[placeholder],[aria-label],[title],input[type=submit][value]").forEach(function (el) {
        if (el.closest('[translate="no"]')) return;
        ["placeholder", "aria-label", "title", "value"].forEach(function (a) {
            if (a === "value" && el.type !== "submit") return;
            var v = el.getAttribute(a);
            if (v && /\p{L}/u.test(v)) { attrs.push([el, a, v]); add(v.trim()); }
        });
    });
    add(document.title.trim());
    if (!texts.length) return;

    var parts = {};
    for (var i = 0; i < texts.length; i += 30) parts["p" + (i / 30)] = texts.slice(i, i + 30);
    var body = JSON.stringify(parts);
    var h = 0; for (var j = 0; j < body.length; j++) h = (h * 31 + body.charCodeAt(j)) | 0;
    var cacheKey = "pagelang:" + code + ":" + h;

    function apply(result) {
        var out = [];
        Object.keys(parts).forEach(function (k) {
            var got = Array.isArray(result[k]) ? result[k] : parts[k];
            parts[k].forEach(function (t, n) { out.push(typeof got[n] === "string" && got[n] ? got[n] : t); });
        });
        function tr(t) { var k = t.trim(); return Object.prototype.hasOwnProperty.call(seen, k) ? out[seen[k]] : t; }
        nodes.forEach(function (n) {
            var m = n.nodeValue.match(/^(\s*)([\s\S]*?)(\s*)$/);
            n.nodeValue = m[1] + tr(m[2]) + m[3];
        });
        attrs.forEach(function (a) { a[0].setAttribute(a[1], tr(a[2])); });
        document.title = tr(document.title);
    }
    try { var kept = localStorage.getItem(cacheKey); if (kept) { apply(JSON.parse(kept)); return; } } catch (e) {}

    var note = document.createElement("div");
    note.className = "pagelang-note"; note.setAttribute("role", "status"); note.setAttribute("translate", "no");
    note.textContent = "Translating into " + nameOf(code) + "… (first visit only, a few seconds)";
    document.body.appendChild(note);
    var token = (document.cookie.match(/(?:^|; )XSRF-TOKEN=([^;]+)/) || [])[1] || "";
    fetch("/api/ui-strings/" + code, {
        method: "POST", credentials: "same-origin",
        headers: { "Content-Type": "application/json", "X-XSRF-TOKEN": decodeURIComponent(token) }, body: body
    }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (result) { apply(result); try { localStorage.setItem(cacheKey, JSON.stringify(result)); } catch (e) {} })
      .catch(function () {})
      .finally(function () { note.remove(); });
})();
</script>

</body>
</html>
