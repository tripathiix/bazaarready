<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- Shared pieces of every generated site: the head with styles, the navigation bar, an offering card, and the footer with the script. -->

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Site</title>
    <meta name="description" th:if="${shop.tagline()}" th:content="${shop.tagline()}">
    <link rel="stylesheet" th:href="${fontsUrl}">
    <style th:inline="none">
        :root {
            --brand: #8a4b00; --accent: #e39a1d; --tint: #fff4dd;
            --ink: #1c1d22; --muted: #585b66; --line: #e3e4ea; --bg: #f7f7fa; --surface: #ffffff; --wa: #136c43; --bad: #a8322b;
            --display: "Baloo 2"; --body: "Anek Latin";
        }
        .theme-indigo { --brand: #1b2452; --accent: #5b6ee1; --tint: #eceffd; }
        .theme-forest { --brand: #1d4d36; --accent: #3f9d6b; --tint: #e6f4ec; }
        .theme-rose   { --brand: #7a1f3d; --accent: #d6537e; --tint: #fdebf1; }
        .theme-ocean  { --brand: #0f4c5c; --accent: #2a9db5; --tint: #e3f4f7; }
        .theme-slate  { --brand: #2b3440; --accent: #7d8ea6; --tint: #eef1f5; }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { margin: 0; font-family: var(--body), "Segoe UI", "Nirmala UI", "Noto Sans", system-ui, sans-serif; font-size: 1.05rem; line-height: 1.6; color: var(--ink); background: var(--bg); }
        h1, h2, h3, .brand, .amount, .btn { font-family: var(--display), "Segoe UI", "Nirmala UI", system-ui, sans-serif; }
        .wrap { max-width: 68rem; margin: 0 auto; padding: 0 1.25rem; }
        a { color: var(--brand); }
        :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
        [hidden] { display: none !important; }

        .draft { background: #fff1d6; color: #5c3a00; padding: 0.5rem 1rem; text-align: center; font-size: 0.95rem; }
        .top { position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line); }
        .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem 1.5rem; padding-top: 0.7rem; padding-bottom: 0.7rem; }
        .brand { font-weight: 800; font-size: 1.35rem; line-height: 1.2; text-decoration: none; color: var(--brand); margin-inline-end: auto; }
        .links { display: flex; flex-wrap: wrap; align-items: center; gap: 0.3rem 1.1rem; }
        .links a { text-decoration: none; color: var(--ink); font-weight: 600; padding: 0.25rem 0; border-bottom: 3px solid transparent; }
        .links a.on, .links a:hover { border-bottom-color: var(--accent); }
        .links a.pill { background: var(--brand); color: #ffffff; border-radius: 999px; padding: 0.35rem 1rem; border-bottom: 0; }
        .links a.pill b { background: #ffffff; color: var(--brand); border-radius: 999px; padding: 0 0.45rem; font-size: 0.9rem; margin-inline-start: 0.3rem; }

        .hero { background: var(--brand); color: #ffffff; position: relative; overflow: hidden; }
        .hero::after { content: ""; position: absolute; inset-inline-end: -8rem; top: -8rem; width: 26rem; height: 26rem; border-radius: 50%; background: var(--accent); opacity: 0.28; }
        .hero::before { content: ""; position: absolute; inset-inline-end: 6rem; bottom: -11rem; width: 18rem; height: 18rem; border-radius: 50%; border: 2.5rem solid var(--accent); opacity: 0.18; }
        .hero-photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        .hero.has-photo::before { content: ""; position: absolute; inset: 0; z-index: 1; width: auto; height: auto; border: 0; border-radius: 0; opacity: 1;
            background: linear-gradient(100deg, var(--brand) 0%, color-mix(in srgb, var(--brand) 82%, transparent) 45%, color-mix(in srgb, var(--brand) 20%, transparent) 100%); }
        .hero.has-photo::after { display: none; }
        .hero .wrap { position: relative; z-index: 2; padding-top: 4rem; padding-bottom: 3.5rem; }
        h1 { margin: 0; font-weight: 800; font-size: clamp(2.3rem, 7vw, 4rem); line-height: 1.1; max-width: 18ch; }
        .tagline { margin: 0.8rem 0 0; font-size: clamp(1.1rem, 2.6vw, 1.4rem); max-width: 38rem; opacity: 0.94; }
        .cta { display: flex; flex-wrap: wrap; gap: 0.8rem; margin-top: 1.8rem; }
        .facts { display: flex; flex-wrap: wrap; gap: 0.6rem; margin: 2rem 0 0; padding: 0; list-style: none; }
        .facts li { background: rgba(255, 255, 255, 0.15); border-radius: 999px; padding: 0.3rem 0.9rem; font-size: 0.95rem; }

        .btn { display: inline-block; font-weight: 800; font-size: 1.05rem; text-decoration: none; cursor: pointer; border: 2px solid var(--brand); background: var(--brand); color: #ffffff; padding: 0.7rem 1.4rem; border-radius: 999px; transition: transform 0.12s ease, box-shadow 0.12s ease; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0, 0, 0, 0.18); }
        .btn.light { background: #ffffff; color: var(--brand); border-color: #ffffff; }
        .btn.ghost { background: transparent; color: #ffffff; border-color: rgba(255, 255, 255, 0.7); }
        .btn.outline { background: transparent; color: var(--brand); }
        .btn.wa { background: var(--wa); border-color: var(--wa); }
        .btn.small { font-size: 0.95rem; padding: 0.4rem 1rem; }
        .btn.wide { width: 100%; text-align: center; }

        main { padding: 2.5rem 0 5rem; display: flex; flex-direction: column; gap: 3rem; }
        h2 { margin: 0 0 1.1rem; font-weight: 800; font-size: clamp(1.5rem, 3.6vw, 2rem); line-height: 1.2; }
        h2::after { content: ""; display: block; width: 3rem; height: 4px; border-radius: 2px; background: var(--accent); margin-top: 0.5rem; }
        .lead { margin: 0; font-size: 1.2rem; max-width: 46rem; }
        .head-row { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 1rem; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(15.5rem, 1fr)); gap: 1.1rem; padding: 0; margin: 0; list-style: none; }
        .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.15s ease, box-shadow 0.15s ease; }
        .card:hover { transform: translateY(-4px); box-shadow: 0 12px 28px rgba(20, 20, 40, 0.12); }
        .tile { display: grid; place-items: center; height: 10.5rem; background: var(--tint); text-decoration: none; overflow: hidden; }
        .tile img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s ease; }
        .card:hover .tile img { transform: scale(1.06); }
        .tile span { font-family: var(--display), "Nirmala UI", sans-serif; font-weight: 800; font-size: 3.4rem; color: var(--brand); opacity: 0.85; }
        .card-body { padding: 1rem 1.1rem 1.1rem; display: flex; flex-direction: column; gap: 0.35rem; flex: 1; }
        .card h3 { margin: 0; font-size: 1.2rem; line-height: 1.3; }
        .card h3 a { text-decoration: none; color: var(--ink); }
        .card p { margin: 0; color: var(--muted); font-size: 0.97rem; }
        .route { font-weight: 600; color: var(--brand) !important; }
        .chip { align-self: flex-start; background: var(--tint); color: var(--brand); border-radius: 999px; padding: 0.1rem 0.7rem; font-size: 0.88rem; font-weight: 600; }
        .price { margin-top: auto; padding-top: 0.5rem; display: flex; align-items: baseline; flex-wrap: wrap; gap: 0.4rem; }
        .amount { font-size: 1.5rem; font-weight: 800; color: var(--brand); font-variant-numeric: tabular-nums; }
        .unit { color: var(--muted); font-size: 0.95rem; }
        .card-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 0.7rem; padding-top: 0.6rem; }

        .filters { display: flex; flex-wrap: wrap; gap: 0.7rem; align-items: center; }
        .filters input { flex: 1 1 12rem; }
        .cats { display: flex; flex-wrap: wrap; gap: 0.5rem; }
        .cat { font: inherit; font-weight: 600; cursor: pointer; background: var(--surface); color: var(--ink); border: 2px solid var(--line); border-radius: 999px; padding: 0.25rem 0.9rem; }
        .cat[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #ffffff; }

        input, select, textarea { font: inherit; color: inherit; width: 100%; background: var(--surface); border: 2px solid var(--line); border-radius: 10px; padding: 0.6rem 0.8rem; }
        input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; }
        label { font-weight: 600; display: block; margin-bottom: 0.25rem; }
        .form { display: grid; gap: 1rem; max-width: 34rem; }
        .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: 1rem; }
        .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 1.4rem; }
        .error { color: var(--bad); font-weight: 600; margin: 0; }
        .trap { position: absolute; left: -9999px; }

        .info { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 1rem; }
        .info div { background: var(--tint); border-radius: 14px; padding: 1.1rem 1.3rem; }
        .info h3 { margin: 0 0 0.3rem; font-size: 1.05rem; color: var(--brand); }
        .info p { margin: 0; }
        .faq details { border-bottom: 1px solid var(--line); padding: 0.9rem 0; max-width: 46rem; }
        .faq summary { cursor: pointer; font-weight: 700; font-size: 1.08rem; }
        .faq details p { margin: 0.5rem 0 0; color: var(--muted); }
        .band { background: var(--brand); color: #ffffff; border-radius: 20px; padding: 2.2rem 1.5rem; text-align: center; }
        .band h2::after { margin-inline: auto; background: #ffffff; opacity: 0.6; }

        .detail { display: grid; grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr)); gap: 2rem; align-items: start; }
        .detail .tile { height: 18rem; border-radius: 20px; }
        .detail .tile span { font-size: 8rem; }

        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: start; padding: 0.7rem 0.4rem; border-bottom: 1px solid var(--line); vertical-align: middle; }
        td.num, th.num { text-align: end; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .qty { display: inline-flex; align-items: center; gap: 0.4rem; }
        .qty button { font: inherit; font-weight: 800; width: 2rem; height: 2rem; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); cursor: pointer; }
        .linkish { font: inherit; background: none; border: 0; color: var(--bad); cursor: pointer; text-decoration: underline; padding: 0; }
        .total { display: flex; justify-content: space-between; font-size: 1.3rem; font-weight: 800; padding: 1rem 0.4rem 0; }
        .demo { background: #fff1d6; color: #5c3a00; border: 2px dashed #c98a00; border-radius: 12px; padding: 0.8rem 1rem; font-weight: 600; }
        .done { text-align: center; max-width: 36rem; margin: 0 auto; }
        .tick { width: 4.5rem; height: 4.5rem; border-radius: 50%; background: var(--wa); color: #ffffff; display: grid; place-items: center; font-size: 2.4rem; margin: 0 auto 1rem; animation: pop 0.4s cubic-bezier(0.2, 1.5, 0.4, 1) both; }
        @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }

        .credits { font-size: 0.8rem; }
        .credits a { color: var(--muted); }
        footer { text-align: center; color: var(--muted); font-size: 0.9rem; padding: 0 1rem 2.5rem; }
        @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .card, .btn { transition: none; } .tick { animation: none; } }
    </style>
</head>

<body>

<header th:fragment="nav" class="top">
    <div class="draft" role="status" th:if="${draft}" th:text="${L.of('draft_banner')}">Preview</div>
    <nav class="bar wrap" aria-label="Main">
        <a class="brand" th:href="${base}" th:text="${shop.name()}">Name</a>
        <div class="links">
            <a th:href="${base}" th:classappend="${page == 'home'} ? 'on'" th:text="${L.of('nav_home')}">Home</a>
            <a th:href="${base + '/catalogue'}" th:classappend="${page == 'catalogue'} ? 'on'" th:text="${offeringsTitle}">Catalogue</a>
            <a th:href="${base + '/about'}" th:classappend="${page == 'about'} ? 'on'" th:text="${L.of('nav_about')}">About</a>
            <a th:href="${base + '/contact'}" th:classappend="${page == 'contact'} ? 'on'" th:text="${L.of('nav_contact')}">Contact</a>
            <a class="pill" th:if="${booking}" th:href="${base + '/book'}" th:text="${L.of('nav_book')}">Book</a>
            <a class="pill" th:if="${store}" th:href="${base + '/cart'}"><span th:text="${L.of('nav_cart')}">Cart</span><b data-cart-count hidden>0</b></a>
        </div>
    </nav>
</header>

<li th:fragment="card(p)" class="card"
    th:attr="data-text=${p.name() + ' ' + (p.description() ?: '') + ' ' + (p.category() ?: '')},data-category=${p.category() ?: ''},data-origin=${p.origin() ?: ''},data-destination=${p.destination() ?: ''}">
    <a class="tile" th:href="${base + '/item/' + p.id()}" tabindex="-1" aria-hidden="true">
        <img th:if="${thumbs.get(p.id()) != null}" th:src="${thumbs.get(p.id()).url()}" alt="" loading="lazy" decoding="async">
        <span th:unless="${thumbs.get(p.id()) != null}" th:text="${#strings.substring(p.name(), 0, 1)}">A</span>
    </a>
    <div class="card-body">
        <h3><a th:href="${base + '/item/' + p.id()}" th:text="${p.name()}">Offering</a></h3>
        <p class="route" th:if="${p.origin() != null and p.destination() != null}"><span th:text="${p.origin()}">A</span> → <span th:text="${p.destination()}">B</span></p>
        <p th:if="${p.description()}" th:text="${p.description()}">Description</p>
        <p th:if="${p.schedule()}" th:text="${p.schedule()}">Schedule</p>
        <span class="chip" th:if="${p.note()}" th:text="${p.note()}">Note</span>
        <div class="price">
            <span class="unit" th:if="${p.priceNote() != null and p.priceRupees() != null}" th:text="${p.priceNote()}">from</span>
            <span class="amount" th:if="${p.priceRupees() != null}" th:text="${money.format(p.priceRupees())}">0</span>
            <span class="unit" th:if="${p.priceRupees() == null}" th:text="${p.priceNote() ?: L.of('price_on_request')}">On request</span>
            <span class="unit" th:if="${p.unit()}" th:text="${p.unit()}">per unit</span>
        </div>
        <div class="card-actions">
            <button type="button" class="btn small" th:if="${store and p.priceRupees() != null}"
                    th:attr="data-add=${p.id()},data-label=${L.of('add_to_cart')},data-added=${L.of('added')}" th:text="${L.of('add_to_cart')}">Add to cart</button>
            <a class="btn small" th:if="${booking}" th:href="${base + '/book?item=' + p.id()}" th:text="${L.of('book_now')}">Book</a>
            <a th:href="${base + '/item/' + p.id()}" th:text="${L.of('view')}">View details</a>
        </div>
    </div>
</li>

<footer th:fragment="foot">
    <p><span th:text="${shop.name()}">Name</span> · Made with BazaarReady</p>
    <p class="credits" th:if="${!credits.isEmpty()}">Photos:
        <th:block th:each="c, it : ${credits}"><a th:href="${c.pageUrl()}" rel="noopener" th:text="${c.photographer()}">Name</a><span th:if="${c.licence()}"> (<a th:href="${c.licenceUrl()}" rel="noopener license" th:text="${c.licence()}">CC BY</a>)</span> <span th:text="${'via ' + c.source()}">via Pexels</span><span th:unless="${it.last}">; </span></th:block>
    </p>
    <script th:inline="none">
    (function () {
        var body = document.body;
        var KEY = 'cart:' + body.dataset.slug;
        function read() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
        function write(cart) { try { localStorage.setItem(KEY, JSON.stringify(cart)); } catch (e) { /* cart stays for this page only */ } badge(); }
        function count(cart) { return Object.keys(cart).reduce(function (sum, id) { return sum + cart[id]; }, 0); }
        function badge() {
            var el = document.querySelector('[data-cart-count]');
            if (!el) return;
            var n = count(read());
            el.textContent = n;
            el.hidden = n === 0;
        }
        if (body.dataset.clearCart === 'true') write({});
        badge();

        // "Add to cart" buttons anywhere on the site.
        document.addEventListener('click', function (event) {
            var button = event.target.closest('[data-add]');
            if (!button) return;
            var cart = read();
            cart[button.dataset.add] = Math.min(99, (cart[button.dataset.add] || 0) + 1);
            write(cart);
            button.textContent = button.dataset.added;
            setTimeout(function () { button.textContent = button.dataset.label; }, 1200);
        });

        // Catalogue: search box, category buttons, and from/to boxes for routes.
        var grid = document.querySelector('[data-grid]');
        if (grid) {
            var search = document.querySelector('[data-search]');
            var from = document.querySelector('[data-from]');
            var to = document.querySelector('[data-to]');
            var empty = document.querySelector('[data-none]');
            var category = '';
            var has = function (value, query) { return !query || (value || '').toLowerCase().indexOf(query.trim().toLowerCase()) !== -1; };
            var apply = function () {
                var shown = 0;
                Array.prototype.forEach.call(grid.children, function (card) {
                    var ok = has(card.dataset.text, search ? search.value : '')
                        && (!category || card.dataset.category === category)
                        && has(card.dataset.origin, from ? from.value : '')
                        && has(card.dataset.destination, to ? to.value : '');
                    card.hidden = !ok;
                    if (ok) shown++;
                });
                if (empty) empty.hidden = shown !== 0;
            };
            [search, from, to].forEach(function (input) { if (input) input.addEventListener('input', apply); });
            Array.prototype.forEach.call(document.querySelectorAll('[data-category-button]'), function (button) {
                button.addEventListener('click', function () {
                    category = button.dataset.categoryButton;
                    Array.prototype.forEach.call(document.querySelectorAll('[data-category-button]'), function (other) {
                        other.setAttribute('aria-pressed', String(other === button));
                    });
                    apply();
                });
            });
        }

        // Cart page: rows are drawn from the saved cart; prices come from the page, not from storage.
        var cartEl = document.querySelector('[data-cart]');
        if (cartEl) {
            var products = JSON.parse(document.getElementById('products').textContent);
            var symbol = cartEl.dataset.currency;
            var rows = cartEl.querySelector('tbody');
            var form = document.querySelector('[data-checkout]');
            var money = function (value) { return symbol + (Math.round(value * 100) % 100 === 0 ? Math.round(value) : value.toFixed(2)); };
            var draw = function () {
                var cart = read();
                var total = 0;
                rows.textContent = '';
                products.forEach(function (product) {
                    var quantity = cart[product.id];
                    if (!quantity) return;
                    total += product.price * quantity;
                    var row = rows.insertRow();
                    row.insertCell().textContent = product.name + (product.unit ? ' (' + product.unit + ')' : '');
                    var qty = row.insertCell();
                    qty.innerHTML = '<span class="qty"><button type="button" data-step="-1" aria-label="-">−</button><span></span><button type="button" data-step="1" aria-label="+">+</button></span>';
                    qty.querySelector('span span').textContent = quantity;
                    Array.prototype.forEach.call(qty.querySelectorAll('button'), function (button) {
                        button.addEventListener('click', function () {
                            var next = read();
                            next[product.id] = Math.max(0, Math.min(99, (next[product.id] || 0) + Number(button.dataset.step)));
                            if (!next[product.id]) delete next[product.id];
                            write(next);
                            draw();
                        });
                    });
                    var price = row.insertCell();
                    price.className = 'num';
                    price.textContent = money(product.price * quantity);
                    var remove = row.insertCell();
                    remove.className = 'num';
                    var link = document.createElement('button');
                    link.type = 'button';
                    link.className = 'linkish';
                    link.textContent = cartEl.dataset.remove;
                    link.addEventListener('click', function () { var next = read(); delete next[product.id]; write(next); draw(); });
                    remove.appendChild(link);
                });
                var any = rows.children.length > 0;
                cartEl.querySelector('[data-filled]').hidden = !any;
                cartEl.querySelector('[data-empty]').hidden = any;
                cartEl.querySelector('[data-total]').textContent = money(total);
                if (form) form.hidden = !any;
            };
            draw();
            if (form) form.addEventListener('submit', function () { form.querySelector('[name=cart]').value = JSON.stringify(read()); });
        }
    })();
    </script>
</footer>

</body>
</html>
