<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${htmlLang}" th:dir="${dir}">
<head th:replace="~{site/parts :: head(${L.of('pay_title') + ' · ' + shop.name()})}"></head>
<body th:class="'theme-' + ${shop.theme()}" th:style="${fontVars}" th:attr="data-slug=${shop.slug()}">
<header th:replace="~{site/parts :: nav}"></header>

<main class="wrap">
    <section aria-labelledby="title" style="max-width:36rem">
        <h1 id="title" style="color:var(--brand)" th:text="${L.of('pay_title')}">Payment</h1>

        <div class="panel" style="margin-top:1.5rem">
            <table>
                <tbody>
                <tr th:each="line : ${orderLines}">
                    <td><span th:text="${line.name()}">Item</span> × <span th:text="${line.quantity()}">1</span></td>
                    <td class="num" th:text="${money.minor(line.lineTotalPaise())}">0</td>
                </tr>
                </tbody>
            </table>
            <div class="total"><span th:text="${L.of('total')}">Total</span><span th:text="${money.minor(order.getTotalPaise())}">0</span></div>
        </div>

        <p class="demo" role="note" style="margin:1.5rem 0" th:text="${L.of('pay_demo')}">This is a demo payment page.</p>

        <!-- The card number below is a fixed sample and cannot be edited, so nobody types a real card here. -->
        <form class="panel form" method="post" th:action="${base + '/pay/' + order.getId()}">
            <div>
                <label for="card" th:text="${L.of('pay_card')}">Card number</label>
                <input id="card" value="4242 4242 4242 4242" readonly aria-readonly="true">
            </div>
            <button type="submit" name="method" value="demo" class="btn wide" th:text="${L.of('pay_now', 'amount', money.minor(order.getTotalPaise()))}">Pay</button>
            <button type="submit" name="method" value="later" class="btn outline wide" th:text="${L.of('pay_later')}">Pay on delivery</button>
        </form>
    </section>
</main>

<footer th:replace="~{site/parts :: foot}"></footer>
</body>
</html>
