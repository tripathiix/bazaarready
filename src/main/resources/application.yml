spring:
  application:
    name: bazaarready
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bazaarready}
    username: ${DB_USER:bazaarready}
    password: ${DB_PASSWORD:}
  servlet:
    multipart:
      # Instagram downloads can include photos; only the message files inside are read.
      max-file-size: 60MB
      max-request-size: 64MB
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8080
  # Redirects carry only the path, so they work on any address: localhost, a tunnel or the real domain.
  tomcat:
    use-relative-redirects: true
    # An Instagram download can hold hundreds of conversations, each sent as its own small file.
    max-part-count: 320
  # Read the visitor's real address from the proxy in front (Caddy or the tunnel). Tomcat only trusts
  # these headers from private-network addresses, so they can't be faked from outside.
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 7d
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health

# Secrets come from environment variables (see .env.example). Never put them in this file.
bazaarready:
  # Shops are served at {slug}.{app-domain} in production and at /s/{slug} everywhere.
  app-domain: ${APP_DOMAIN:localhost}
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
  pexels:
    api-key: ${PEXELS_API_KEY:}
  # Daily caps on calls to Claude, to protect the API credits during public judging.
  # "Continue with Google". Leave empty to hide the button. Values come from Google Cloud Console.
  # Sign-in for building sites and the idea coach. Off for the hackathon demo so anyone can try it;
  # the owner dashboard always needs sign-in. Set AUTH_FOR_BUILDING=true to require it for building too.
  auth:
    for-building: ${AUTH_FOR_BUILDING:false}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
  # Contact form mail, sent through the Titan mailbox. GoDaddy-sold Titan uses smtpout.secureserver.net
  # (port 465, SSL), not smtp.titan.email. Without a password,
  # messages are still saved and simply not emailed.
  smtp:
    host: ${SMTP_HOST:smtpout.secureserver.net}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USERNAME:support@bazaarready.com}
    password: ${SMTP_PASSWORD:}
    to: ${SUPPORT_EMAIL:support@bazaarready.com}
  claude:
    daily-cap: ${CLAUDE_DAILY_CAP:3000}
    per-account-daily-cap: ${CLAUDE_PER_ACCOUNT_DAILY_CAP:400}
