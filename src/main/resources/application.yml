spring:
  application:
    name: bazaarready
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bazaarready}
    username: ${DB_USER:bazaarready}
    password: ${DB_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8080
  # Redirects carry only the path, so they work on any address: localhost, a tunnel or the real domain.
  tomcat:
    use-relative-redirects: true
  # Read the visitor's real address from the proxy in front (Caddy or the tunnel). Tomcat only trusts
  # these headers from private-network addresses, so they can't be faked from outside.
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 7d
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health

# Secrets come from environment variables (see .env.example). Never put them in this file.
bazaarready:
  # Shops are served at {slug}.{app-domain} in production and at /s/{slug} everywhere.
  app-domain: ${APP_DOMAIN:localhost}
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
  pexels:
    api-key: ${PEXELS_API_KEY:}
  # Daily caps on calls to Claude, to protect the API credits during public judging.
  claude:
    daily-cap: ${CLAUDE_DAILY_CAP:3000}
    per-account-daily-cap: ${CLAUDE_PER_ACCOUNT_DAILY_CAP:400}
