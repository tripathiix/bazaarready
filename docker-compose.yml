services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-bazaarready}
      POSTGRES_USER: ${DB_USER:-bazaarready}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bazaarready} -d ${DB_NAME:-bazaarready}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-bazaarready}
      DB_USER: ${DB_USER:-bazaarready}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      AUTH_FOR_BUILDING: ${AUTH_FOR_BUILDING:-false}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
    ports:
      - "${APP_PORT:-8090}:8080"

volumes:
  dbdata:
